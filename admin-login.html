<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - Latihan Siswa</title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >
</head>

<body class="admin-login-page">

    <main class="admin-login-shell">

        <section class="admin-login-card">

            <div class="admin-login-badge">
                ADMIN
            </div>

            <h1>
                Latihan Siswa
            </h1>

            <p class="admin-login-description">
                Masuk untuk memantau perkembangan siswa.
            </p>


            <form
                id="adminLoginForm"
                class="admin-login-form"
            >

                <label class="admin-field">

                    <span>
                        Username
                    </span>

                    <input
                        id="adminUsername"
                        type="text"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                    >

                </label>


                <label class="admin-field">

                    <span>
                        Password
                    </span>

                    <input
                        id="adminPassword"
                        type="password"
                        autocomplete="current-password"
                        required
                    >

                </label>


                <div
                    id="adminLoginMessage"
                    class="admin-login-message"
                    aria-live="polite"
                ></div>


                <button
                    id="adminLoginButton"
                    class="admin-primary-button"
                    type="submit"
                >
                    Masuk
                </button>

            </form>


            <div class="admin-login-footer">

                <a href="index.html">
                    ← Kembali ke halaman siswa
                </a>

            </div>

        </section>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/config.js"></script>

    <script src="js/admin-login.js"></script>

</body>

</html>
