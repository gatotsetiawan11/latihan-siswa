<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Latihan Siswa</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">
    <div class="topbar-brand">
        <small>LATIHAN SISWA</small>
        <strong id="headerName">Memuat...</strong>
    </div>
    <button id="logoutButton" class="logout-button" type="button">Keluar</button>
</header>

<main class="dashboard">

<section id="studentWelcome" class="welcome-card">
    <p>Selamat datang</p>
    <h1 id="studentName">Memuat...</h1>
</section>

<section id="guestNotice" class="guest-notice hidden">
    <strong>Mode Guest</strong>
    <p>Anda dapat mencoba latihan, tetapi perkembangan tidak akan disimpan.</p>
</section>

<section id="studentReportSection" class="hidden" style="margin-bottom:34px;">
    <div class="section-title">
        <p>PERKEMBANGAN</p>
        <h2>Laporan Belajar</h2>
    </div>
    <div class="subject-grid">
        <button id="reportButton" class="subject-card" type="button">
            <div class="subject-icon">✓</div>
            <div>
                <h3>Lihat Perkembangan</h3>
                <p>Lihat perkembangan belajar siswa.</p>
            </div>
        </button>
    </div>
</section>

<section>
<div class="section-title">
    <p>PEMBELAJARAN</p>
    <h2>Pilih Mata Pelajaran</h2>
</div>

<div class="subject-grid">

<button id="mathButton" class="subject-card" type="button">
    <div class="subject-icon">×</div>
    <div>
        <h3>Matematika</h3>
        <p>Latihan kemampuan matematika secara bertahap.</p>
    </div>
</button>

<button id="englishButton" class="subject-card" type="button">
    <div class="subject-icon">EN</div>
    <div>
        <h3>Bahasa Inggris</h3>
        <p>Conversation interaktif dengan AI.</p>
    </div>
</button>

<div class="subject-card">
    <div class="subject-icon">2</div>
    <div>
        <h3>Kelas 2</h3>
        <p>Pilih latihan sesuai kelas.</p>
    </div>
</div>

<button id="ipasButton" class="subject-card" type="button">
    <div class="subject-icon">IP</div>
    <div>
        <h3>IPAS</h3>
        <p>Ilmu Pengetahuan Alam dan Sosial.</p>
    </div>
</button>

<button id="indonesiaButton" class="subject-card" type="button">
    <div class="subject-icon">A</div>
    <div>
        <h3>Bahasa Indonesia</h3>
        <p>Latihan Bahasa Indonesia Kelas 2.</p>
    </div>
</button>

</div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/dashboard.js?v=ipas-v1"></script>

<script>
document.getElementById("ipasButton").onclick = function(){
    window.location.href="./topics.html?subject=ipas";
};

document.getElementById("indonesiaButton").onclick = function(){
    window.location.href="./topics.html?subject=indonesia";
};
</script>

</body>
</html>
